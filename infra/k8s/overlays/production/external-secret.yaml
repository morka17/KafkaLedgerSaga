apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saganova-secrets
  namespace: saganova
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: saganova-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: saganova/production/app-secrets
