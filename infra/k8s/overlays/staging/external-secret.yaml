# Requires the External Secrets Operator (https://external-secrets.io)
# installed in the cluster, configured with a SecretStore pointing at
# AWS Secrets Manager (provisioned by infra/terraform/environments/staging).
# This REPLACES base/common-secrets.yaml's placeholder - see kustomization.yaml's patch removing it.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: saganova-secrets
  namespace: saganova
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: saganova-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: saganova/staging/app-secrets
