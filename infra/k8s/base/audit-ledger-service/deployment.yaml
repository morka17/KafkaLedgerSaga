apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-ledger-service
  namespace: saganova
  labels:
    app: audit-ledger-service
    app.kubernetes.io/part-of: saganova
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-ledger-service
  template:
    metadata:
      labels:
        app: audit-ledger-service
    spec:
      containers:
        - name: audit-ledger-service
          image: saganova/audit-ledger-service:latest # overridden per-environment - see infra/k8s/overlays/*/kustomization.yaml
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: saganova-common-config
            - configMapRef:
                name: audit-ledger-service-config
          env:
            - name: AUDIT_LEDGER_SERVICE_PORT
              value: "3005"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "saganova"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: saganova-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: saganova-secrets, key: DB_PASSWORD }
          livenessProbe:
            httpGet: { path: /health/live, port: 3005 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: 3005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
