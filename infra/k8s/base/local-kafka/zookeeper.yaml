apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: saganova
  labels:
    app: zookeeper
spec:
  serviceName: zookeeper
  replicas: 1 # dev/staging only - production uses a managed Kafka service (see infra/terraform/modules/msk), which has no in-cluster Zookeeper at all
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: saganova
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
