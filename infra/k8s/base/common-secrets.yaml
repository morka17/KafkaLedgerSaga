# PLACEHOLDER ONLY - never commit real values to this file.
#
# In dev/staging, this is typically replaced by `kubectl create secret`
# from a local .env, or sealed via kubeseal before committing. In
# production, this manifest is not applied at all - use External
# Secrets Operator or the AWS Secrets Manager CSI driver to sync from
# the secrets manager Terraform provisions (see infra/terraform), so
# real credentials never pass through kubectl or a Git history.
apiVersion: v1
kind: Secret
metadata:
  name: saganova-secrets
  namespace: saganova
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  DB_USERNAME: "saganova"
  DB_PASSWORD: "REPLACE_ME"
  STRIPE_SECRET_KEY: "REPLACE_ME"
  SENDGRID_API_KEY: "REPLACE_ME"
  TWILIO_ACCOUNT_SID: "REPLACE_ME"
  TWILIO_AUTH_TOKEN: "REPLACE_ME"
  TWILIO_FROM_NUMBER: "REPLACE_ME"
