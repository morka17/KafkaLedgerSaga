apiVersion: apps/v1
kind: Deployment
metadata:
  name: saga-orchestrator
  namespace: saganova
  labels:
    app: saga-orchestrator
    app.kubernetes.io/part-of: saganova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: saga-orchestrator
  template:
    metadata:
      labels:
        app: saga-orchestrator
    spec:
      containers:
        - name: saga-orchestrator
          image: saganova/saga-orchestrator:latest # overridden per-environment - see infra/k8s/overlays/*/kustomization.yaml
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: saganova-common-config
            - configMapRef:
                name: saga-orchestrator-config
          env:
            - name: SAGA_ORCHESTRATOR_PORT
              value: "3004"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "saganova"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: saganova-secrets, key: DB_USERNAME }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: saganova-secrets, key: DB_PASSWORD }
          livenessProbe:
            httpGet: { path: /health/live, port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /health/ready, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
